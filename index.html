    <style>
      @media (prefers-reduced-motion: reduce) {
        * {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.001ms !important;
        }
      }

      body {
        background-color: #f6f4ee;
      }

      .perf-line {
        height: 1px;
        background-image: repeating-linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.28) 0,
          rgba(255, 255, 255, 0.28) 6px,
          transparent 6px,
          transparent 13px
        );
      }

      .tie-strip {
        height: 6px;
        background-image: repeating-linear-gradient(
          90deg,
          #1044d1 0,
          #1044d1 22px,
          transparent 22px,
          transparent 34px
        );
      }

      .board-panel {
        background: linear-gradient(180deg, #212933 0%, #171d24 100%);
      }

      .card-lift {
        transition:
          transform 0.2s ease,
          border-color 0.2s ease,
          box-shadow 0.2s ease;
      }
      .card-lift:hover {
        transform: translateY(-3px);
        border-color: #1044d1;
        box-shadow: 0 14px 28px -16px rgba(23, 29, 36, 0.35);
      }

      .code-tag {
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.04em;
      }

      .live-dot {
        background: #e0a23b;
        box-shadow: 0 0 0 0 rgba(224, 162, 59, 0.55);
        animation: live-pulse 2.2s infinite;
      }
      @keyframes live-pulse {
        0% {
          box-shadow: 0 0 0 0 rgba(224, 162, 59, 0.55);
        }
        70% {
          box-shadow: 0 0 0 7px rgba(224, 162, 59, 0);
        }
        100% {
          box-shadow: 0 0 0 0 rgba(224, 162, 59, 0);
        }
      }

      #frameView {
        display: none;
      }
      #frameView.active {
        display: flex;
      }
      #idleBar {
        transition: width linear;
      }

      #frameNotice {
        display: none;
      }
      #frameNotice.show {
        display: flex;
      }

      /* ===== Admin access easter egg ===== */
      #portalGaTrigger {
        cursor: pointer;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      #adminAccessBtn {
        opacity: 0;
        transform: translateY(10px) scale(0.96);
        pointer-events: none;
        transition:
          opacity 0.35s ease,
          transform 0.35s ease;
      }
      #adminAccessBtn.shown {
        opacity: 1;
        transform: translateY(0) scale(1);
        pointer-events: auto;
      }

      @keyframes admin-btn-pop {
        0% {
          box-shadow: 0 0 0 0 rgba(16, 68, 209, 0.45);
        }
        70% {
          box-shadow: 0 0 0 10px rgba(16, 68, 209, 0);
        }
        100% {
          box-shadow: 0 0 0 0 rgba(16, 68, 209, 0);
        }
      }
      #adminAccessBtn.shown {
        animation: admin-btn-pop 1.1s ease-out 0.35s 1;
      }
    </style>
  </head>

            target="_blank"
            rel="noopener noreferrer"
            class="inline-flex items-center gap-1.5 rounded-md border border-white/20 px-3 py-2 font-mono text-xs font-600 text-steel-200 transition-colors hover:border-brand-400 hover:text-white"
          >
            Buka di tab baru
            <svg
              class="h-3.5 w-3.5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M14 5l7 7m0 0l-7 7m7-7H3"
              />
            </svg>
          </a>
        </div>
      </div>
      <div class="h-0.5 w-full bg-steel-100">
        <div id="idleBar" class="h-0.5 bg-brand-600" style="width: 100%"></div>
      </div>
      <div class="relative flex-1">
        <iframe
          id="serviceFrame"
          class="h-full w-full border-0"
          src=""
          title="Layanan GA"
        ></iframe>
        <div
          id="frameNotice"
          class="pointer-events-none absolute inset-x-0 top-4 flex justify-center"
        >
          <div
            class="pointer-events-auto flex items-center gap-3 rounded-lg border border-amber-500/30 bg-amber-50 px-4 py-2.5 shadow-md"
          >
            <span class="font-body text-xs text-amber-800">
              Halaman ini sepertinya belum bisa ditampilkan di sini.
            </span>
            <a
              id="frameNoticeLink"
              href="#"
              target="_blank"
              rel="noopener noreferrer"
              class="whitespace-nowrap rounded-md bg-amber-500 px-3 py-1.5 font-mono text-[11px] font-600 text-white transition-colors hover:bg-amber-600"
            >
              Buka di tab baru
            </a>
          </div>
        </div>
      </div>
    </div>

    <!-- Tombol akses admin tersembunyi — muncul setelah judul "Portal GA" diklik 3x -->
    <button
      type="button"
      id="adminAccessBtn"
      onclick="window.location.href = 'admin/homeadm.html'"
      class="fixed bottom-5 right-5 z-40 inline-flex items-center gap-2 rounded-full border border-white/10 bg-steel-900 px-4 py-2.5 font-mono text-[11px] font-600 tracking-wide text-white shadow-lg transition-colors hover:bg-steel-800 focus:outline-none focus-visible:ring-2 focus-visible:ring-brand-500"
    >
      <svg
        class="h-3.5 w-3.5 text-brand-300"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="2"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 10-8 0v4h8z"
        />
      </svg>
      Dashboard Admin
    </button>

    <script>
      const IDLE_TIMEOUT_MS = 60000; // 60 detik tanpa aktivitas -> kembali ke menu
      const NOTICE_DELAY_MS = 4000; // tampilkan notice fallback jika load lambat/gagal
      const menuView = document.getElementById("menuView");
      const frameView = document.getElementById("frameView");
      const serviceFrame = document.getElementById("serviceFrame");
      const frameTitle = document.getElementById("frameTitle");
      const fallbackLink = document.getElementById("fallbackLink");
      const idleBar = document.getElementById("idleBar");
      const frameNotice = document.getElementById("frameNotice");
      const frameNoticeLink = document.getElementById("frameNoticeLink");

      let idleTimer = null;
      let noticeTimer = null;

      function openService(el) {
        const url = el.getAttribute("data-url");
        const fallbackUrl = el.getAttribute("data-fallback-url") || url;
        const title = el.getAttribute("data-title") || "Layanan";

        frameNotice.classList.remove("show");
        frameNoticeLink.href = fallbackUrl;

        serviceFrame.src = url;
        frameTitle.textContent = title;
        fallbackLink.href = fallbackUrl;

        menuView.style.display = "none";
        frameView.classList.add("active");
        document.body.style.overflow = "hidden";

        resetIdleTimer();

        clearTimeout(noticeTimer);
        noticeTimer = setTimeout(() => {
          frameNotice.classList.add("show");
        }, NOTICE_DELAY_MS);
      }

      serviceFrame.addEventListener("load", () => {
        if (serviceFrame.src) clearTimeout(noticeTimer);
      });

      function backToMenu() {
        frameView.classList.remove("active");
        menuView.style.display = "";
        document.body.style.overflow = "";
        serviceFrame.src = ""; // hentikan konten & aktivitas di dalam iframe
        frameNotice.classList.remove("show");
        clearTimeout(idleTimer);
        clearTimeout(noticeTimer);
      }

      function resetIdleTimer() {
        clearTimeout(idleTimer);
        if (!frameView.classList.contains("active")) return;

        idleBar.style.transition = "none";
        idleBar.style.width = "100%";
        void idleBar.offsetWidth;
        idleBar.style.transition = `width ${IDLE_TIMEOUT_MS}ms linear`;
        idleBar.style.width = "0%";

        idleTimer = setTimeout(() => {
          backToMenu();
        }, IDLE_TIMEOUT_MS);
      }

      [
        "mousemove",
        "keydown",
        "touchstart",
        "click",
        "scroll",
        "wheel",
      ].forEach((evt) => {
        window.addEventListener(
          evt,
          () => {
            if (frameView.classList.contains("active")) resetIdleTimer();
          },
          { passive: true },
        );
      });

      // Saat fokus pindah ke iframe (mis. mengisi form), jeda hitung mundur;
      // saat fokus kembali ke halaman utama, lanjutkan lagi.
      window.addEventListener("blur", () => {
        if (
          frameView.classList.contains("active") &&
          document.activeElement === serviceFrame
        ) {
          clearTimeout(idleTimer);
          idleBar.style.transition = "none";
          idleBar.style.width = "100%";
        }
      });
      window.addEventListener("focus", () => {
        if (frameView.classList.contains("active")) resetIdleTimer();
      });

      // Escape sebagai jalan pintas kembali ke menu
      window.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && frameView.classList.contains("active")) {
          backToMenu();
        }
      });

      // ===== Admin access easter egg: klik "Portal GA" 3x untuk munculkan tombol =====
      const ADMIN_CLICK_TARGET = 3;
      const ADMIN_CLICK_RESET_MS = 900; // jeda maksimum antar klik sebelum hitungan reset
      let adminClickCount = 0;
      let adminClickResetTimer = null;
      const adminAccessBtn = document.getElementById("adminAccessBtn");

      function handlePortalTitleClick() {
        adminClickCount++;
        clearTimeout(adminClickResetTimer);

        if (adminClickCount >= ADMIN_CLICK_TARGET) {
          adminClickCount = 0;
          revealAdminButton();
          return;
        }

        adminClickResetTimer = setTimeout(() => {
          adminClickCount = 0;
        }, ADMIN_CLICK_RESET_MS);
      }

      function revealAdminButton() {
        adminAccessBtn.classList.add("shown");
      }
    </script>
  </body>
</html>
