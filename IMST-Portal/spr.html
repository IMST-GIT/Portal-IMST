<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Status Laporan SPR — PT IMST</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --blue: #1044d1;
        --blue-deep: #0b2f94;
        --blue-tint: #eef2fe;
        --ink: #12182b;
        --ink-soft: #5b6478;
        --ink-faint: #9aa2b2;
        --border: #e3e6ed;
        --green: #1c7a44;
        --green-tint: #e7f5ec;
        --amber: #b5720f;
        --amber-tint: #fbf1e0;
        --bg: #ffffff;
        --bg-soft: #f7f8fc;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: "Plus Jakarta Sans", system-ui, sans-serif;
      }
      a {
        color: inherit;
        text-decoration: none;
      }

      .page {
        max-width: 1040px;
        margin: 0 auto;
        padding: 30px 24px 70px;
      }
      .page-head {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: 16px;
        flex-wrap: wrap;
        margin-bottom: 22px;
      }
      h1 {
        font-family: "Source Serif 4", Georgia, serif;
        font-weight: 600;
        font-size: 27px;
        letter-spacing: -0.01em;
        color: var(--ink);
      }
      .subtitle {
        font-size: 13.5px;
        color: var(--ink-soft);
        margin-top: 5px;
      }

      /* ===== Stat strip ===== */
      .stats {
        display: flex;
        gap: 0;
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
        margin-bottom: 22px;
      }
      .stat {
        flex: 1;
        padding: 14px 18px;
        border-right: 1px solid var(--border);
      }
      .stat:last-child {
        border-right: none;
      }
      .stat-num {
        font-size: 22px;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
      }
      .stat-num.blue {
        color: var(--blue);
      }
      .stat-num.green {
        color: var(--green);
      }
      .stat-num.amber {
        color: var(--amber);
      }
      .stat-label {
        font-size: 11.5px;
        color: var(--ink-soft);
        margin-top: 3px;
      }

      /* ===== Search / filter ===== */
      .toolbar {
        display: flex;
        gap: 10px;
        margin-bottom: 18px;
        flex-wrap: wrap;
        align-items: center;
      }
      .search-box {
        flex: 1;
        min-width: 220px;
        position: relative;
      }
      .search-box input {
        width: 100%;
        padding: 10px 14px 10px 36px;
        border: 1px solid var(--border);
        border-radius: 7px;
        font-family: inherit;
        font-size: 13.5px;
        color: var(--ink);
        background: var(--bg-soft);
      }
      .search-box input:focus {
        outline: none;
        border-color: var(--blue);
        background: var(--bg);
      }
      .search-box::before {
        content: "⌕";
        position: absolute;
        left: 13px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--ink-faint);
        font-size: 15px;
      }
      .filter-chip {
        padding: 9px 14px;
        border: 1px solid var(--border);
        border-radius: 7px;
        font-size: 12.5px;
        font-weight: 600;
        color: var(--ink-soft);
        cursor: pointer;
        background: var(--bg);
        user-select: none;
        transition: all 0.15s ease;
      }
      .filter-chip.active {
        background: var(--blue);
        border-color: var(--blue);
        color: #fff;
      }
      .filter-chip:hover:not(.active) {
        border-color: var(--blue);
        color: var(--blue);
      }

      /* ===== List ===== */
      .list {
        border-top: 1px solid var(--border);
      }
      .report-row {
        display: grid;
        grid-template-columns: 88px 1.6fr 1.3fr 118px 108px;
        align-items: center;
        gap: 16px;
        padding: 15px 4px;
        border-bottom: 1px solid var(--border);
      }
      .spr-no {
        font-size: 12.5px;
        font-weight: 700;
        color: var(--blue);
        font-variant-numeric: tabular-nums;
      }
      .spr-no .no-label {
        display: block;
        font-size: 9.5px;
        font-weight: 700;
        color: var(--ink-faint);
        letter-spacing: 0.6px;
        text-transform: uppercase;
        margin-bottom: 2px;
      }

      .issue-name {
        font-size: 14px;
        font-weight: 700;
        color: var(--ink);
        line-height: 1.35;
      }
      .issue-desc {
        font-size: 12.5px;
        color: var(--ink-soft);
        margin-top: 3px;
        line-height: 1.4;
      }

      .meta {
        font-size: 12.5px;
        color: var(--ink-soft);
        line-height: 1.5;
      }
      .meta .name {
        color: var(--ink);
        font-weight: 600;
      }
      .meta .tag {
        display: inline-block;
        font-size: 10.5px;
        font-weight: 700;
        color: var(--ink-faint);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 1px 6px;
        margin-top: 4px;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.6px;
        text-transform: uppercase;
        padding: 4px 10px;
        border-radius: 20px;
        width: fit-content;
      }
      .badge-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
      }
      .badge.done {
        color: var(--green);
        background: var(--green-tint);
      }
      .badge.done .badge-dot {
        background: var(--green);
      }
      .badge.open {
        color: var(--amber);
        background: var(--amber-tint);
      }
      .badge.open .badge-dot {
        background: var(--amber);
      }

      .date-col {
        font-size: 12px;
        color: var(--ink-soft);
        text-align: right;
      }
      .date-col .label {
        display: block;
        font-size: 9.5px;
        color: var(--ink-faint);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 2px;
      }

      .state-msg {
        text-align: center;
        padding: 60px 20px;
        color: var(--ink-soft);
        font-size: 13.5px;
      }
      .state-msg.error {
        color: #b5301f;
      }
      .retry-btn {
        margin-top: 14px;
        background: var(--blue);
        border: none;
        color: #fff;
        padding: 8px 20px;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 600;
        font-size: 13px;
      }
      .retry-btn:hover {
        background: var(--blue-deep);
      }

      footer {
        margin-top: 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
        font-size: 12px;
        color: var(--ink-faint);
      }
      .sync-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--green);
        display: inline-block;
        margin-right: 6px;
      }

      @media (max-width: 720px) {
        .report-row {
          grid-template-columns: 1fr;
          row-gap: 6px;
          padding: 16px 2px;
        }
        .date-col {
          text-align: left;
        }
        .stats {
          flex-wrap: wrap;
        }
        .stat {
          min-width: 45%;
          border-bottom: 1px solid var(--border);
        }
      }
      :focus-visible {
        outline: 2px solid var(--blue);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="page-head">
        <div>
          <h1>Status Laporan SPR</h1>
          <!-- <div class="subtitle">
            Surat Permintaan Reparasi — kerusakan aset dan fasilitas
          </div> -->
        </div>
      </div>

      <div class="stats" id="stats" style="display: none">
        <div class="stat">
          <div class="stat-num blue" id="statTotal">–</div>
          <div class="stat-label">Total laporan</div>
        </div>
        <div class="stat">
          <div class="stat-num amber" id="statOpen">–</div>
          <div class="stat-label">Belum selesai</div>
        </div>
        <div class="stat">
          <div class="stat-num green" id="statDone">–</div>
          <div class="stat-label">Selesai</div>
        </div>
      </div>

      <div class="toolbar">
        <div class="search-box">
          <input
            type="text"
            id="searchInput"
            placeholder="Cari nomor SPR, divisi, atau nama alat/fasilitas…"
          />
        </div>
        <div class="filter-chip" data-filter="all">Semua</div>
        <div class="filter-chip active" data-filter="open">Belum Selesai</div>
        <div class="filter-chip" data-filter="done">Selesai</div>
      </div>

      <div class="list" id="list">
        <div class="state-msg" id="stateMsg">
          Menghubungkan ke Google Sheets…
        </div>
      </div>

      <footer>
        <div><span class="sync-dot"></span>Sinkron otomatis tiap 60 detik</div>
        <div id="lastSync">Belum sinkron</div>
      </footer>
    </div>

    <script>
      const SHEET_ID = "1sZ-u99isDu8XUsXrxhEGRLGJ9eLZAGd0wTwPwhDVMpM";
      const GVIZ_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;

      let allReports = [];
      let activeFilter = "open";
      let searchTerm = "";

      const monthsShort = [
        "Jan",
        "Feb",
        "Mar",
        "Apr",
        "Mei",
        "Jun",
        "Jul",
        "Agu",
        "Sep",
        "Okt",
        "Nov",
        "Des",
      ];
      function pad(n) {
        return String(n).padStart(2, "0");
      }

      function parseGvizValue(v) {
        if (typeof v !== "string") return v;
        const m = v.match(
          /Date\((\d+),(\d+),(\d+)(?:,(\d+))?(?:,(\d+))?(?:,(\d+))?\)/,
        );
        if (!m) return v;
        return new Date(
          parseInt(m[1]),
          parseInt(m[2]),
          parseInt(m[3]),
          m[4] ? parseInt(m[4]) : 0,
          m[5] ? parseInt(m[5]) : 0,
          m[6] ? parseInt(m[6]) : 0,
        );
      }

      function fmtDate(val) {
        if (!val) return "—";
        const d = parseGvizValue(val);
        if (d instanceof Date) {
          return `${d.getDate()} ${monthsShort[d.getMonth()]} ${d.getFullYear()}`;
        }
        return String(val);
      }

      function escapeHtml(str) {
        const div = document.createElement("div");
        div.textContent = str == null ? "" : String(str);
        return div.innerHTML;
      }

      async function fetchReports() {
        const res = await fetch(GVIZ_URL);
        if (!res.ok) throw new Error("HTTP " + res.status);
        const text = await res.text();
        const jsonStr = text.substring(
          text.indexOf("{"),
          text.lastIndexOf("}") + 1,
        );
        const data = JSON.parse(jsonStr);
        const rows = data.table.rows || [];

        const reports = [];
        for (const r of rows) {
          const c = r.c || [];
          const get = (i) => (c[i] ? c[i].v : null);
          const nomorSpr = get(3);
          if (!nomorSpr) continue; // skip empty trailing rows

          reports.push({
            status: get(0),
            tindakLanjut: get(1),
            tanggalRealisasi: get(2),
            nomorSpr: nomorSpr,
            timestamp: get(4),
            divisi: get(7) || "—",
            mesin: get(9) || "—",
            tanggalKerusakan: get(10),
            lokasi: get(12) || "",
            uraian: get(14) || "",
            tipe: get(15) || "",
            prioritas: get(16) || "",
          });
        }
        return reports;
      }

      function isDone(r) {
        return (r.status || "").toString().trim().toUpperCase() === "CLOSE";
      }

      function renderList() {
        const list = document.getElementById("list");
        list.innerHTML = "";

        let items = allReports.filter((r) => {
          if (activeFilter === "open" && isDone(r)) return false;
          if (activeFilter === "done" && !isDone(r)) return false;
          if (searchTerm) {
            const hay = `${r.nomorSpr} ${r.mesin} ${r.divisi}`.toLowerCase();
            if (!hay.includes(searchTerm)) return false;
          }
          return true;
        });

        // open items first (most actionable), then by newest timestamp
        items.sort((a, b) => {
          const da = isDone(a),
            db = isDone(b);
          if (da !== db) return da ? 1 : -1;
          const ta = parseGvizValue(a.timestamp);
          const tb = parseGvizValue(b.timestamp);
          if (ta instanceof Date && tb instanceof Date) return tb - ta;
          return 0;
        });

        if (items.length === 0) {
          list.innerHTML = `<div class="state-msg">Tidak ada laporan yang cocok.</div>`;
          return;
        }

        items.forEach((r) => {
          const row = document.createElement("div");
          row.className = "report-row";

          const done = isDone(r);

          const noCol = document.createElement("div");
          noCol.className = "spr-no";
          noCol.innerHTML = `<span class="no-label">No. SPR</span>${escapeHtml(r.nomorSpr)}`;

          const issueCol = document.createElement("div");
          issueCol.innerHTML =
            `<div class="issue-name">${escapeHtml(r.mesin)}</div>` +
            (r.uraian
              ? `<div class="issue-desc">${escapeHtml(r.uraian)}</div>`
              : "");

          const metaCol = document.createElement("div");
          metaCol.className = "meta";
          metaCol.innerHTML =
            `<span class="name">${escapeHtml(r.divisi)}</span>` +
            (r.tipe
              ? `<br><span class="tag">${escapeHtml(
                  r.tipe
                    .replace(/\(.*?\)/, "")
                    .trim()
                    .slice(0, 24),
                )}</span>`
              : "");

          const badgeCol = document.createElement("div");
          badgeCol.innerHTML = done
            ? `<div class="badge done"><span class="badge-dot"></span>Selesai</div>`
            : `<div class="badge open"><span class="badge-dot"></span>Diproses</div>`;

          const dateCol = document.createElement("div");
          dateCol.className = "date-col";
          dateCol.innerHTML = done
            ? `<span class="label">Realisasi</span>${fmtDate(r.tanggalRealisasi)}`
            : `<span class="label">Lapor</span>${fmtDate(r.tanggalKerusakan)}`;

          row.appendChild(noCol);
          row.appendChild(issueCol);
          row.appendChild(metaCol);
          row.appendChild(badgeCol);
          row.appendChild(dateCol);
          list.appendChild(row);
        });
      }

      function renderStats() {
        const total = allReports.length;
        const done = allReports.filter(isDone).length;
        const open = total - done;
        document.getElementById("statTotal").textContent = total;
        document.getElementById("statOpen").textContent = open;
        document.getElementById("statDone").textContent = done;
        document.getElementById("stats").style.display = "flex";
      }

      function showError() {
        document.getElementById("list").innerHTML =
          `<div class="state-msg error">Gagal memuat data dari Google Sheets.<br>Pastikan sheet sudah di-share &quot;Anyone with the link can view&quot;.
    <br><button class="retry-btn" onclick="loadData()">Coba Lagi</button></div>`;
      }

      async function loadData() {
        try {
          allReports = await fetchReports();
          renderStats();
          renderList();
          const now = new Date();
          document.getElementById("lastSync").textContent =
            `Sinkron terakhir pukul ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
        } catch (err) {
          console.error(err);
          showError();
        }
      }

      document.getElementById("searchInput").addEventListener("input", (e) => {
        searchTerm = e.target.value.trim().toLowerCase();
        renderList();
      });

      document.querySelectorAll(".filter-chip").forEach((chip) => {
        chip.addEventListener("click", () => {
          document
            .querySelectorAll(".filter-chip")
            .forEach((c) => c.classList.remove("active"));
          chip.classList.add("active");
          activeFilter = chip.dataset.filter;
          renderList();
        });
      });

      loadData();
      setInterval(loadData, 60000);
    </script>
  </body>
</html>
